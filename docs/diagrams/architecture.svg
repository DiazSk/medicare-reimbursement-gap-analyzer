<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc" id="architecture-root">
        <title id="arch-title">Medallion pipeline on two substrates</title>
        <desc id="arch-desc">The same five medallion notebooks run over either an Azure ingest path, now retired, or a local PySpark path, and serve a published dashboard and a Power BI model.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper:       #f5f4f6;
      --color-ink:         #16181a;
      --color-muted:       #4f5156;
      --color-soft:        #6b6d72;
      --color-rule:        #c9c7c4;
      --color-accent:      #184f95;
      --color-accent-tint: #dcddf3;
      --color-link:        #2a78d6;
      --font-sans:  'Schibsted Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono:  'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5156"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#184f95"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a78d6"/></marker>
          <marker id="architecture-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6d72"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f4f6"/>

        <!-- ============ ZONES (drawn first: bg -> zones -> arrows -> nodes) ============ -->

        <!-- Local substrate: the live one -->
        <rect x="256" y="64" width="216" height="192" rx="8" fill="#16181a" fill-opacity="0.02" stroke="#16181a" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="282" y="68" width="164" height="12" rx="2" fill="#f5f4f6"/>
        <text x="364" y="77" fill="#6b6d72" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOCAL REPRODUCTION · CURRENT</text>

        <!-- Azure substrate: retired, so a dashed boundary -->
        <rect x="256" y="296" width="216" height="192" rx="8" fill="#16181a" fill-opacity="0.02" stroke="#16181a" stroke-opacity="0.10" stroke-width="0.8" stroke-dasharray="4,3"/>
        <rect x="284" y="300" width="160" height="12" rx="2" fill="#f5f4f6"/>
        <text x="364" y="309" fill="#6b6d72" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AZURE · SUBSCRIPTION RETIRED</text>

        <!-- ============ ARROWS (before nodes, so they sit behind) ============ -->

        <!-- CMS -> PySpark (live path) -->
        <path d="M 200,268 H 208 Q 216,268 216,260 V 136 Q 216,128 224,128 H 272" fill="none" stroke="#2a78d6" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <!-- CMS -> Data Factory (retired path) -->
        <path d="M 200,284 H 232 Q 240,284 240,292 V 352 Q 240,360 248,360 H 272" fill="none" stroke="#6b6d72" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow-soft)"/>

        <!-- inside each zone -->
        <line x1="364" y1="160" x2="364" y2="176" stroke="#2a78d6" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <line x1="364" y1="392" x2="364" y2="408" stroke="#6b6d72" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow-soft)"/>

        <!-- both substrates converge on the notebooks -->
        <path d="M 456,208 H 468 Q 476,208 476,216 V 240 Q 476,248 484,248 H 512" fill="none" stroke="#2a78d6" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <path d="M 456,440 H 484 Q 492,440 492,432 V 312 Q 492,304 500,304 H 512" fill="none" stroke="#6b6d72" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow-soft)"/>

        <!-- notebooks -> serving -->
        <line x1="688" y1="240" x2="728" y2="240" stroke="#4f5156" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <line x1="688" y1="320" x2="728" y2="320" stroke="#4f5156" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

        <!-- ============ NODES ============ -->

        <!-- CMS source -->
        <rect x="56" y="244" width="144" height="64" rx="6" fill="#f5f4f6"/>
        <rect x="56" y="244" width="144" height="64" rx="6" fill="#f5f4f6" stroke="#6b6d72" stroke-width="1"/>
        <rect x="64" y="250" width="40" height="12" rx="2" fill="none" stroke="#6b6d72" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="84" y="259" fill="#6b6d72" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
        <text x="128" y="282" fill="#16181a" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" text-anchor="middle">CMS 2023 claims</text>
        <text x="128" y="298" fill="#4f5156" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3.06 GB · public domain</text>

        <!-- PySpark (local compute) -->
        <rect x="272" y="96" width="184" height="64" rx="6" fill="#f5f4f6"/>
        <rect x="272" y="96" width="184" height="64" rx="6" fill="#f5f4f6" stroke="#16181a" stroke-width="1"/>
        <rect x="280" y="102" width="46" height="12" rx="2" fill="none" stroke="#16181a" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="303" y="111" fill="#16181a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMPUTE</text>
        <text x="364" y="134" fill="#16181a" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" text-anchor="middle">PySpark 3.5 · Delta 3.3</text>
        <text x="364" y="150" fill="#4f5156" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">local[8]</text>

        <!-- local Delta tables -->
        <rect x="272" y="176" width="184" height="64" rx="6" fill="#f5f4f6"/>
        <rect x="272" y="176" width="184" height="64" rx="6" fill="#dcddf3" fill-opacity="0.45" stroke="#16181a" stroke-width="1"/>
        <rect x="280" y="182" width="34" height="12" rx="2" fill="none" stroke="#16181a" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="297" y="191" fill="#16181a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="364" y="214" fill="#16181a" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" text-anchor="middle">Delta tables on disk</text>
        <text x="364" y="230" fill="#4f5156" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data/{bronze,silver,gold}</text>

        <!-- Data Factory (retired) -->
        <rect x="272" y="328" width="184" height="64" rx="6" fill="#f5f4f6"/>
        <rect x="272" y="328" width="184" height="64" rx="6" fill="#f5f4f6" stroke="#6b6d72" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="280" y="334" width="40" height="12" rx="2" fill="none" stroke="#6b6d72" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="300" y="343" fill="#6b6d72" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INGEST</text>
        <text x="364" y="366" fill="#4f5156" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" text-anchor="middle">Data Factory</text>
        <text x="364" y="382" fill="#6b6d72" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scheduled copy</text>

        <!-- ADLS Gen2 (retired) -->
        <rect x="272" y="408" width="184" height="64" rx="6" fill="#f5f4f6"/>
        <rect x="272" y="408" width="184" height="64" rx="6" fill="#f5f4f6" stroke="#6b6d72" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="280" y="414" width="34" height="12" rx="2" fill="none" stroke="#6b6d72" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="297" y="423" fill="#6b6d72" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="364" y="446" fill="#4f5156" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" text-anchor="middle">ADLS Gen2</text>
        <text x="364" y="462" fill="#6b6d72" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Key Vault · Entra · OAuth 2.0</text>

        <!-- FOCAL 1: the shared notebook chain -->
        <rect x="512" y="200" width="176" height="152" rx="6" fill="#f5f4f6"/>
        <rect x="512" y="200" width="176" height="152" rx="6" fill="#dcddf3" fill-opacity="0.55" stroke="#184f95" stroke-width="1.4"/>
        <rect x="520" y="206" width="48" height="12" rx="2" fill="none" stroke="#184f95" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="544" y="215" fill="#184f95" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PIPELINE</text>
        <text x="600" y="246" fill="#16181a" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" text-anchor="middle">Medallion notebooks</text>
        <text x="600" y="262" fill="#184f95" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">IDENTICAL ON BOTH PATHS</text>
        <text x="600" y="286" fill="#4f5156" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">01  bronze → silver</text>
        <text x="600" y="299" fill="#4f5156" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">02  → gold dims</text>
        <text x="600" y="312" fill="#4f5156" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">03  → gold fact</text>
        <text x="600" y="325" fill="#4f5156" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">04  → 5 hero marts</text>
        <text x="600" y="338" fill="#4f5156" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">99  DQ · 13 assertions</text>

        <!-- FOCAL 2: the live dashboard -->
        <rect x="728" y="208" width="176" height="64" rx="6" fill="#f5f4f6"/>
        <rect x="728" y="208" width="176" height="64" rx="6" fill="#dcddf3" fill-opacity="0.55" stroke="#184f95" stroke-width="1.4"/>
        <rect x="736" y="214" width="44" height="12" rx="2" fill="none" stroke="#184f95" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="758" y="223" fill="#184f95" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVING</text>
        <text x="816" y="246" fill="#16181a" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" text-anchor="middle">Dashboard + SQL</text>
        <text x="816" y="262" fill="#4f5156" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GitHub Pages · DuckDB-Wasm</text>

        <!-- Power BI model -->
        <rect x="728" y="288" width="176" height="64" rx="6" fill="#f5f4f6"/>
        <rect x="728" y="288" width="176" height="64" rx="6" fill="#f5f4f6" stroke="#16181a" stroke-width="1"/>
        <rect x="736" y="294" width="36" height="12" rx="2" fill="none" stroke="#16181a" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="754" y="303" fill="#16181a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
        <text x="816" y="326" fill="#16181a" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" text-anchor="middle">Power BI-ready star</text>
        <text x="816" y="342" fill="#4f5156" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MODEL.md · MEASURES.md</text>

        <!-- ============ LEGEND (horizontal bottom strip) ============ -->
        <line x1="56" y1="520" x2="904" y2="520" stroke="#c9c7c4" stroke-width="1"/>

        <line x1="56" y1="548" x2="88" y2="548" stroke="#2a78d6" stroke-width="1.2"/>
        <text x="96" y="551" fill="#4f5156" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">LIVE PATH</text>

        <line x1="192" y1="548" x2="224" y2="548" stroke="#6b6d72" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="232" y="551" fill="#4f5156" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETIRED PATH</text>

        <rect x="372" y="542" width="12" height="12" rx="2" fill="#dcddf3" fill-opacity="0.55" stroke="#184f95" stroke-width="1.4"/>
        <text x="392" y="551" fill="#4f5156" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL</text>

        <rect x="476" y="542" width="12" height="12" rx="2" fill="#dcddf3" fill-opacity="0.45" stroke="#16181a" stroke-width="1"/>
        <text x="496" y="551" fill="#4f5156" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STORE</text>

        <rect x="580" y="542" width="12" height="12" rx="2" fill="#f5f4f6" stroke="#16181a" stroke-width="1"/>
        <text x="600" y="551" fill="#4f5156" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">COMPUTE / MODEL</text>

        <rect x="740" y="542" width="12" height="12" rx="2" fill="#f5f4f6" stroke="#6b6d72" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="760" y="551" fill="#4f5156" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DECOMMISSIONED</text>
      </svg>
